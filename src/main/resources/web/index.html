<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>
        Adaptive Biomechanical Resilience System
    </title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <h1>
        Adaptive Biomechanical
        Resilience System
    </h1>

    <div id="metrics"
         class="metrics">
    </div>

    <div class="modePanel">

        <button id="manualMode">
            MANUAL MODE
        </button>

        <button id="conservativeMode">
            CONSERVATIVE AUTO
        </button>

        <button id="aggressiveMode">
            AGGRESSIVE AUTO
        </button>

    </div>
    <div class="timelinePanel">

        <button id="playTimeline">
            PLAY
        </button>

        <button id="pauseTimeline">
            PAUSE
        </button>

        <button id="resetTimeline">
            RESET
        </button>

    </div>
    <div class="layout">

        <div class="leftPanel">

            <div id="bodyContainer"
                 class="bodyContainer">

                <div id="bodyMap"
                     class="bodyMap">

                <div id="head"
                     class="bodyPart">
                </div>

                <div id="arms"
                     class="bodyPart arms">
                </div>

                <div id="spine"
                     class="bodyPart">
                </div>

                <div id="pelvis"
                     class="bodyPart">
                </div>

                <div id="legs"
                     class="bodyPart">
                </div>

                </div>

            </div>

            <div class="controls">
                <h2>
                    CONTROL PANEL
                </h2>

                <div id="controlPanel"></div>

            </div>

        </div>

        <div id="dashboard"></div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
